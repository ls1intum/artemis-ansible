---
roles:
  - src: geerlingguy.docker

  - src: geerlingguy.certbot

  - src: geerlingguy.postgresql
    version: 4.1.0

  - src: mrlesmithjr.nfs-server

  - src: mrlesmithjr.netplan

  - src: tomereli.proxy

collections:
  - name: https://github.com/ls1intum/artemis-ansible-collection.git
    type: git
    version: main

  - name: ansible.posix
  - name: community.crypto
  - name: community.docker
  - name: community.general
  - name: community.mysql
  # 5.0.0 for the `memberships` parameter of postgresql_membership, used by the
  # postgres_exporter role of the Artemis collection.
  - name: community.postgresql
    version: ">=5.0.0"
  # Provides the postgres_exporter role that ls1intum.artemis.postgres_exporter wraps -
  # the maintained successor of the archived cloudalchemy exporter roles.
  - name: prometheus.prometheus
