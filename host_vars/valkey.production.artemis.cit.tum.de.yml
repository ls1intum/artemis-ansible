---
# IPv6 address (with CIDR!) which can be used to access the node - If left blank, ansible will use host facts to fill the address.
wireguard_host_ipv6_address: 2a09:80c0:ac18:4600::35
host_ipv4_address: 172.24.70.35

# Address of the node inside the network.
wireguard_interface_address: "fcfe:0:0:0:0:0:b:3"

# Wireguard Keys - Automatically generated!
wireguard_pubkey: Z5v/D/+5PqNTKruxLorll07nSOEcP0UjSigTHGTGyks=
wireguard_privkey: "{{ lookup('hashi_vault', 'artemis/data/production/wireguard').get('privkey_valkey') }}"
