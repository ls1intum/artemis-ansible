---
- name: Setup
  hosts: artemis_production_db

  # geerlingguy.postgresql only installs the distribution's PostgreSQL packages, and no
  # Debian/Ubuntu release ships PostgreSQL 18 yet. The PGDG apt repository has to be in
  # place before the role's "Ensure PostgreSQL packages are installed" task runs, so it
  # is added here rather than as a role dependency.
  pre_tasks:
    - name: Add the PGDG apt repository
      ansible.builtin.deb822_repository:
        name: pgdg
        types: [deb]
        uris: "https://apt.postgresql.org/pub/repos/apt"
        suites: "{{ ansible_distribution_release }}-pgdg"
        components: [main]
        signed_by: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
        state: present
      become: true
      notify: Update apt cache
      tags: postgresql

  handlers:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true

  roles:
    - role: geerlingguy.postgresql
      become: true

    - role: ls1intum.artemis.db_backup
      tags: backup
      vars:
        artemis_database_backup_dir: /srv/artemis-db
        artemis_database_backup_script_path: /opt/artemis-backup.sh

    - role: ls1intum.artemis.firewall
      tags: firewall

  post_tasks:
    # The postgres_exporter on this host connects as "exporter", a role that is set up outside this
    # repository, and reads pg_stat_statements, whose functions live in schema public. The public schema
    # of this database grants USAGE only to its owner, so without this grant every exporter query fails
    # with "function pg_stat_statements(boolean) does not exist". Skipped where the role does not exist.
    - name: Check whether the metrics exporter can use schema public
      ansible.builtin.command:
        argv:
          - psql
          - "-d"
          - "{{ artemis_database_dbname }}"
          - "-tAc"
          - >-
            SELECT CASE
            WHEN NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'exporter') THEN 'absent'
            WHEN has_schema_privilege('exporter', 'public', 'USAGE') THEN 'granted'
            ELSE 'missing' END
      become: true
      become_user: postgres
      changed_when: false
      register: exporter_schema_usage
      tags: monitoring

    - name: Let the metrics exporter use schema public
      ansible.builtin.command:
        argv:
          - psql
          - "-d"
          - "{{ artemis_database_dbname }}"
          - "-c"
          - "GRANT USAGE ON SCHEMA public TO exporter"
      become: true
      become_user: postgres
      changed_when: true
      when: exporter_schema_usage.stdout == 'missing'
      tags: monitoring
