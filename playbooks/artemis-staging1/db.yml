---
- name: Setup
  hosts: artemis_staging1_db

  # geerlingguy.postgresql only installs the distribution's PostgreSQL packages, and no
  # Debian/Ubuntu release ships PostgreSQL 18 yet. The PGDG apt repository has to be in
  # place before the role's "Ensure PostgreSQL packages are installed" task runs, so it
  # is added here rather than as a role dependency.
  pre_tasks:
    - name: Add the PGDG apt repository
      ansible.builtin.deb822_repository:
        name: pgdg
        types: [deb]
        uris: "https://apt.postgresql.org/pub/repos/apt"
        suites: "{{ ansible_distribution_release }}-pgdg"
        components: [main]
        signed_by: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
        state: present
      become: true
      notify: Update apt cache
      tags: postgresql

  handlers:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true

  roles:
    - role: geerlingguy.postgresql
      tags: database
      become: true

    - role: ls1intum.artemis.firewall
      tags: firewall

  post_tasks:
    - name: Start PostgreSQL after WireGuard
      ansible.builtin.import_tasks: ../shared/postgres_after_wireguard/tasks.yml
      tags: database

    - name: Keep PostgreSQL running after the OOM killer ended a backend
      ansible.builtin.import_tasks: ../shared/postgres_oom_policy/tasks.yml
      tags: database

    - name: Limit the memory of PostgreSQL and its host
      ansible.builtin.import_tasks: ../shared/postgres_memory_limits/tasks.yml
      tags: database

    - name: Install the slow query report
      ansible.builtin.import_tasks: ../shared/postgres_slow_query_report/tasks.yml
      tags: slow-query-report
