---
# Deploy the isolated AI Worker of staging1 with the same artemis_version as the core nodes,
# for example: ansible-playbook playbooks/artemis-staging1/ai-worker.yml -e artemis_version=<version>
- name: Deploy the isolated AI Worker
  hosts: artemis_staging1_generation_workers
  gather_facts: false
  vars:
    artemis_version: # Require the exact release of the core nodes as an extra variable.

  pre_tasks:
    - name: Require the Artemis release used by the core nodes
      ansible.builtin.fail:
        msg: Set artemis_version to the release running on the staging1 core nodes with -e artemis_version=VERSION.
      when: artemis_version | default('', true) | string | trim | length == 0

  roles:
    # Drain the worker before firewall updates, because changed rules can restart Docker.
    - role: ls1intum.artemis.firewall
      tags: firewall

    - role: ls1intum.artemis.ai_worker
      vars:
        # The dedicated VM reaches Valkey over its IPv6 WireGuard interface.
        ai_worker_network_mode: host
