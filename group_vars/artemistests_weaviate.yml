---
##############################################################################
# Weaviate Configuration (test servers)
##############################################################################
weaviate:
  enabled: true
  http_host: weaviate-test.artemis.cit.tum.de
  http_port: 443
  grpc_port: 50051
  scheme: https
  collection_prefix: "{{ weaviate_collection_prefix }}"
  vectorizer_module: text2vec-openai
  open_ai_embedding_model: "Qwen/Qwen3-Embedding-8B"
  open_ai_base_url: https://logos.aet.cit.tum.de/
  gpu_api_key: "{{ llm_api_key }}"
  api_key: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('weaviate_key') }}"
