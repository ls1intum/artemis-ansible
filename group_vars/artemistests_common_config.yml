---
##############################################################################
# Artemis Configuration
##############################################################################
node_id: 1
is_testserver: true
artemis_server_url: "https://{{ var_testserver_name }}.artemis.cit.tum.de"
artemis_email: "{{ var_testserver_name }}.aet@xcit.tum.de"

artemis_version: develop
artemis_branch: develop

artemis_internal_admin_user: artemis_admin
artemis_passkey_enabled: true
artemis_repo_basepath: "/opt/artemis/data"
artemis_tmp_directory: "/tmp"

push_notification_relay: "https://hermes-staging.artemis.cit.tum.de"
# No tum_live: the test servers keep the TUM Live integration off (the Artemis default)

artemis_ssh_key_password:
artemis_ssh_key_path: # "/opt/artemis/sshkeys"
artemis_ssh_key_name: "id_ecdsa"
artemis_ssh_priv_key_value: ""

use_docker: true
artemis_system_ram_proportion: 0.6 # Limit Artemis to 60% RAM (also runs DB on same VM)

apollon_url: "https://apollon.aet.cit.tum.de"

artemis_operator_name: "Research group of Applied Education Technologies"
artemis_operator_admin_name: "Stephan Krusche"
artemis_university_name: "Technical University of Munich"

artemis_global_search_enabled: true

lti:
  oauth_secret: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('lti_oauth_secret') }}"

licenses:
  matlab: "28000@mlm1.rbg.tum.de"

helios:
  environment_name: "{{ var_testserver_name }}.artemis.cit.tum.de"
  endpoints:
    - url: "https://helios.aet.cit.tum.de/api/environments/status"
      secret_key: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('helios_prod_secret') }}"
    - url: "https://helios-staging.aet.cit.tum.de/api/environments/status"
      secret_key: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('helios_test_secret') }}"

artemis_rate_limit:
  account_management_rpm: 5
  authentication_rpm: 30

# LLM catalog and preset assignments (https://docs.artemis.tum.de/admin/llm-configuration), for every test server,
# kept in one place. Assignments of modules that are off on a server are not read there.
# llm_api_key is defined per test server; artemistestmigration has none, and its only LLM module, Deimos, uses logosdeimos.
artemis_llm:
  endpoints:
    logos:
      base-url: https://logos.aet.cit.tum.de/v1
      api-key: "{{ llm_api_key | default('') }}"
    logosdeimos:
      base-url: https://logos.aet.cit.tum.de/v1
      api-key: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('deimos_llm_key') }}"
  presets:
    large: { endpoint: logos, model: gpt-6.1-terra, api: responses, reasoning-effort: medium }
    atlas: { endpoint: logos, model: gpt-6-luna, api: responses, reasoning-effort: high }
    atlaschat: { endpoint: logos, model: gpt-6.1-terra, api: chat-completions, reasoning-effort: none }
    embed: { endpoint: logos, model: Qwen/Qwen3-Embedding-8B, api: embeddings }
    quizpool: { endpoint: logos, model: Qwen/Qwen3.8-27B, api: chat-completions }
    deimos: { endpoint: logosdeimos, model: openai/gpt-oss-120b, api: chat-completions, temperature: 0.3, timeout: 90s }

artemis_llm_assignments:
  hyperion.llm-presets.default: large
  hyperion.quiz-pool.generator-llm-preset: quizpool
  hyperion.quiz-pool.judge-llm-preset: quizpool
  atlas.atlasllm.llm-presets.default: atlas
  atlas.atlasllm.llm-presets.chat: atlaschat
  weaviate.embedding-llm-preset: embed
  deimos.llm-preset: deimos

# Enables Deimos; its model is the deimos preset above.
deimos: {}

mail:
  hostname: "postout.lrz.de"
  port: "587"
  username: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('mail_username') }}"
  password: "{{ lookup('hashi_vault', 'artemis/data/test/artemistestcommon').get('mail_password') }}"
  protocol: "smtp"
  ssl_trust: "postout.lrz.de"

##############################################################################
# Proxy Configuration
##############################################################################
proxy_ssl_certificate_path: "/var/lib/rbg-cert/live/fullchain.pem"
proxy_ssl_certificate_key_path: "/var/lib/rbg-cert/live/privkey.pem"

firewall_hostgroup: proxy # For use of other iptables rules file

##############################################################################
# Sentry Configuration
##############################################################################
sentry:
  dsn: https://e52d0b9b6b61769f50b088634b4bc781@sentry.aet.cit.tum.de/2
  environment: "{{ var_testserver_name }}"
  traces_sample_rate: 1.0
  send_default_pii: true

##############################################################################
# Deployment User
##############################################################################
artemis_create_deployment_user: true
artemis_deployment_user_name: deployment
artemis_deployment_user_uid: 1338
artemis_deployment_user_comment: "User to deploy artemis to this host"
