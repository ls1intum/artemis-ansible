---
is_testserver: false

artemis_database_dbname: "Artemis"
artemis_database_username: "Artemis"

artemis_internal_admin_user: artemis_admin

artemis_repo_basepath: "/mnt/storage"
artemis_legal_path: "/mnt/storage/legal"
artemis_data_export_path: "/mnt/storage/data-exports"
artemis_tmp_directory: "/opt/artemis/tmp"

artemis_ssh_priv_key_value: "none"

artemis_operator_name: "Research group of Applied Education Technologies"
artemis_operator_admin_name: "Stephan Krusche"
artemis_university_name: "Technical University of Munich"

artemis_database_password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('db_password') }}"
artemis_remote_admin_database_password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('db_remoteadmin_password') }}"
artemis_remote_admin_ro_database_password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('db_remoteadmin_ro_password') }}"

artemis_internal_admin_password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('internal_admin') }}"

##############################################################################
# External Systems Configuration
##############################################################################

push_notification_relay: "https://hermes-prod.artemis.cit.tum.de"

ldap:
  url: "ldaps://iauth.tum.de:636"
  user_dn: "cn=TUINI01-Artemis,ou=bindDNs,ou=iauth,dc=tum,dc=de"
  base: "ou=users,ou=data,ou=prod,ou=iauth,dc=tum,dc=de"
  password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('ldap_password') }}"

artemis_oidc:
  enabled: true
  button_label: "TUM Login"
  client_id: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('oidc_client_id') }}"
  client_secret: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('oidc_client_secret') }}"
  issuer_uri: "https://tumidp.lrz.de/idp/shibboleth"
  authorization_uri: "https://login.tum.de/idp/profile/oidc/authorize"
  token_uri: "https://login.tum.de/idp/profile/oidc/token"
  user_info_uri: "https://login.tum.de/idp/profile/oidc/userinfo"
  jwk_set_uri: "https://login.tum.de/idp/profile/oidc/keyset"
  scopes: ["openid", "profile", "email", "imMatrikelNr"]
  mappings:
    username: "preferred_username"
    matriculation_number: "imMatrikelNr"
    first_name: "given_name"
    last_name: "family_name"
    email: "email"

mail:
  hostname: "postout.lrz.de"
  port: "587"
  username: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('mail_username') }}"
  password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('mail_password') }}"
  protocol: "smtp"
  ssl_trust: "postout.lrz.de"

version_control:
  localvc:
    url: "{{ artemis_server_url }}"
    repo_storage_base_path: /mnt/storage/localvc
    ssh_key_path: /mnt/storage/ssh-keys
    build_agent_use_ssh: true
    ssh_url: "{{ var_artemis_localvc_ssh_url }}"
    # Only enable together with proxy_ssh_proxy_protocol on the proxy; lists the proxy's internal
    # wireguard address, which is the same across all prod-like environments (see host_vars/proxy.*.yml).
    ssh_proxy_protocol_trusted_sources:
      - "fcfe:0:0:0:0:0:f:1"
    # Hide the password option in the clone dialog. Passwords are still accepted by the server, users who
    # have a saved password keep working.
    repository_authentication_mechanisms: token,ssh
    # The day on which password access for Git is planned to end. Only announced in the email and the push
    # message sent to users who still use a password, passwords are not rejected on that day.
    password_authentication_end_date: "2026-12-15"

artemis_ssh_key_path: "/tmp"

apollon_url: "https://apollon.aet.cit.tum.de"

iris:
  url: "https://pyris-prod.artemis.cit.tum.de"
  secret: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('iris_secret') }}"
  rate_limit: 25
  rate_limit_timeframe_hours: 3

artemis_local_llm_deployment_enabled: true

artemis_hyperion_enabled: true

# LLM catalog and preset assignments (https://docs.artemis.tum.de/admin/llm-configuration).
# Logos reports the cost of each call, so no price list is needed.
artemis_llm:
  endpoints:
    logos:
      base-url: https://logos.aet.cit.tum.de/v1
      api-key: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('logos_apikey') }}"
  presets:
    large: { endpoint: logos, model: gpt-6.1-terra, api: responses, reasoning-effort: medium }
    atlas: { endpoint: logos, model: gpt-6-luna, api: responses, reasoning-effort: high }
    atlaschat: { endpoint: logos, model: gpt-5.6-terra, api: chat-completions, reasoning-effort: none }
    embed: { endpoint: logos, model: Qwen/Qwen3-Embedding-8B, api: embeddings }
    quizpool: { endpoint: logos, model: Qwen/Qwen3.8-27B, api: chat-completions }
    # Exercise generation counts every model call itself, so its preset must not retry in the SDK.
    generation: { endpoint: logos, model: Qwen/Qwen3.8-27B, api: chat-completions, temperature: 0.6, max-retries: 0 }

# Assignments of modules that are off on a server are not read there.
artemis_llm_assignments:
  hyperion.llm-presets.default: large
  hyperion.quiz-pool.generator-llm-preset: quizpool
  hyperion.quiz-pool.judge-llm-preset: quizpool
  hyperion.agent.llm-preset: generation
  atlas.atlasllm.llm-presets.default: atlas
  atlas.atlasllm.llm-presets.chat: atlaschat
  weaviate.embedding-llm-preset: embed

weaviate:
  # http_host and collection_prefix are configured in the environment-specific group_vars file, because they differ between environments.
  enabled: true
  http_port: 443
  grpc_port: 50051
  scheme: https
  vectorizer_module: text2vec-openai
  api_key: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('weaviate_apikey') }}"

artemis_global_search_enabled: false

artemis_rate_limit:
  account_management_rpm: 5
  authentication_rpm: 30

##############################################################################
# Proxy Configuration
##############################################################################

proxy_generate_dh_param: false
firewall_hostgroup: default
proxy_forward_ssh: true

##############################################################################
# Broker and Valkey Configuration
##############################################################################

is_multinode_install: true

broker:
  url: "[fcfe:0:0:0:0:0:b:1]" # Broker hostname (Only used in the Artemis role)
  username: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('broker_username') }}"
  password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('broker_password') }}"

artemis_jhipster_jwt: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('jhipster_jwt') }}"

valkey:
  host: "fcfe:0:0:0:0:0:b:3"
  port: 6379
  username: artemis
  password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('valkey_password') }}"
  admin_username: admin
  admin_password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('valkey_admin_password') }}"

artemis_valkey_client_name: "artemis-{{ node_id }}"

##############################################################################
# Deployment User
##############################################################################

artemis_create_deployment_user: true
artemis_deployment_user_name: deployment
artemis_deployment_user_uid: 1338
artemis_deployment_user_comment: "User to deploy artemis to this host"


##############################################################################
# Other Configuration
##############################################################################

# Lower the entropy bits to fix a bug with TSAN and MSAN C exercises
entropy_bits_override: 30
