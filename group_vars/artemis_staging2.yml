---
artemis_server_url: "https://staging2.artemis.cit.tum.de"

artemis_version: "10.6"

var_vault_group: "test/staging2"

var_artemis_localvc_ssh_url: "ssh://git@staging2.artemis.cit.tum.de:7921/"

is_testserver: true

artemis_deployment_user_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3ONXzYqJdq8D67juYUpGpjgHpY74opKaLi4lqGTVyA artemis@xcit.tum.de"

##############################################################################
# External Systems Configuration
##############################################################################

artemis_email: artemis-staging.aet@xcit.tum.de

atlas:
  enabled: true
  atlasllm:
    enabled: true

weaviate:
  http_host: weaviate-staging.artemis.cit.tum.de
  collection_prefix: "Artemis_staging2_"

theia:
  portal_url: https://staging.eduide.student.k8s.aet.cit.tum.de
  images:
    java:
      Java-17: "java-17"
      Java-25: "java-25"

##############################################################################
# Proxy Configuration
##############################################################################

servers:
  - name: "staging2.artemis.cit.tum.de"
    ssl_certificate_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.fullchain.pem
    ssl_certificate_key_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.privkey.pem
    default_server: false

redirects:
  - name: "_"
    ssl_certificate_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.fullchain.pem
    ssl_certificate_key_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.privkey.pem
    default_server: true
    to: "{{ artemis_server_url }}"

# IPs exempt from the git and login rate limits (benchmark servers).
# artemis-performance-test0.artemis.cit.tum.de is dual-stack, and the exemption matches whichever
# address nginx sees, so both families have to be listed or an IPv6 run is silently throttled.
#
# Without this a benchmark run does not fail, it quietly measures almost nothing: a 500-user run drives
# every login from one address within seconds, so 489 of 500 students were answered 429 by the loginlimit
# zone and dropped, and the tool still reported a finished run - of 6,785 requests instead of ~350,000.
proxy_rate_limit_exempt_ips:
  - ip: "131.159.89.112"
    comment: "Benchmark server"
  - ip: "2a09:80c0:89::112"
    comment: "Benchmark server (IPv6)"

# Artemis has its own per-address limiter, separate from nginx's zones above, and the benchmark server has
# to be exempt from both or a run measures the limiter rather than Artemis.
artemis_rate_limit:
  exempt_addresses:
    - "131.159.89.112"
    - "2a09:80c0:89::112"
