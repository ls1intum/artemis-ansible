---
artemis_server_url: "https://staging2.artemis.cit.tum.de"

artemis_version: 9.9.1

var_vault_group: "test/staging2"

# No JHipster registry on staging2. Eureka exists in Artemis only to locate Hazelcast members, and this
# environment runs the Redis distributed data provider, so nothing reads the registry: the application forces
# eureka.client.enabled=false and spring.cloud.discovery.enabled=false whenever the provider is Redis.
# Overriding registry.url from artemis_prod_like_common.yml leaves artemis_eureka_urls empty, so no registry
# address is rendered into the node configuration either.
registry:
  url: null

is_testserver: true

artemis_deployment_user_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3ONXzYqJdq8D67juYUpGpjgHpY74opKaLi4lqGTVyA artemis@xcit.tum.de"

##############################################################################
# External Systems Configuration
##############################################################################

artemis_email: artemis-staging.aet@xcit.tum.de

version_control:
  localvc:
    repo_storage_base_path: /mnt/storage/local-vcs-repos
    ssh_url: "ssh://git@staging2.artemis.cit.tum.de:7921/"

continuous_integration:
  localci:
    url: "{{ artemis_server_url }}"
    concurrent_build_size: 3
    image_cleanup:
      enabled: true
      expiry_days: 7
      schedule_time: "0 0 3 * * *"
# TODO
# athena:
#   url: "{{ lookup('hashi_vault', 'kv/data/artemis/common/athena-staging').get('url') }}"
#   secret: "{{ lookup('hashi_vault', 'kv/data/artemis/common/athena-staging').get('secret') }}"

weaviate:
  enabled: true
  http_host: weaviate-staging.artemis.cit.tum.de
  http_port: 443
  grpc_port: 50051
  scheme: https
  collection_prefix: "Artemis_staging2_"
  vectorizer_module: text2vec-openai
  open_ai_embedding_model: "Qwen/Qwen3-Embedding-8B"
  open_ai_base_url: https://logos.aet.cit.tum.de:8080/
  gpu_api_key: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('logos_apikey') }}"
  api_key: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('weaviate_apikey') }}"


##############################################################################
# Proxy Configuration
##############################################################################
proxy_generate_dh_param: false

servers:
  - name: "staging2.artemis.cit.tum.de"
    ssl_certificate_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.fullchain.pem
    ssl_certificate_key_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.privkey.pem
    default_server: false

redirects:
  - name: "_"
    ssl_certificate_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.fullchain.pem
    ssl_certificate_key_path: /etc/pira-client/live/host:f:aetvm153.cit.tum.de.privkey.pem
    default_server: true
    to: "{{ artemis_server_url }}"

firewall_hostgroup: default
proxy_forward_ssh: true

##############################################################################
# Broker and Registry Configuration
##############################################################################

activemq_version: 2.44.0

broker:
  username: brokeruser

redis:
  host: "fcfe:0:0:0:0:0:b:3"
  port: 6379
  username: artemis
  password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('redis_password') }}"
  admin_username: admin
  admin_password: "{{ lookup('hashi_vault', 'artemis/data/' + var_vault_group + '/nodes').get('redis_admin_password') }}"

artemis_redis_client_name: "artemis-{{ node_id }}"

##############################################################################
# Sentry Env-specific Configuration
##############################################################################
sentry:
  dsn: https://e52d0b9b6b61769f50b088634b4bc781@sentry.aet.cit.tum.de/2
  send_default_pii: true
  environment: staging2
  traces_sample_rate: 1.0

theia:
  portal_url: https://theia-staging.artemis.cit.tum.de
  images:
    java:
      Java-17: "java-17-latest"
    c:
      C: "c-latest"
    javascript:
      Javascript: "javascript-latest"
    ocaml:
      Ocaml: "ocaml-latest"
    python:
      Python: "python-latest"
    rust:
      Rust: "rust-latest"
